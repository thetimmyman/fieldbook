# Pull request and main checks. `ci-ok` is the only required check.
# The corpus and windows jobs arrive with the cards that need them; add them to `needs` of `ci-ok`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels the older run of the same pull request. Runs on main are never
# cancelled, so every commit on main keeps its own guard-statuses result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # Where the secret scan starts: the pull request's base, or the commit before a push.
      FIELDBOOK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The versions below repeat .config/tools.toml; a test and `just doctor` fail if they differ.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0,cargo-nextest@0.9.148,cargo-deny@0.20.2,typos@1.51.1
      - name: Install gitleaks
        run: cargo xtask setup --no-hooks gitleaks
      - name: Check the tools
        run: just doctor
      - name: Check
        run: just check
      - name: Build the development binary
        run: cargo build --locked --package fieldbook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldbook-dev
          path: target/debug/fieldbook
          if-no-files-found: error
          retention-days: 7

  ci-ok:
    needs: [rust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every job this one needs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job finished with: $result"
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Guard statuses
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo xtask guard-statuses "$BASE" "$HEAD"
