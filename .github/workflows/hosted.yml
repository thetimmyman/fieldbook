# Publishes the public edition of Fieldbook to Cloudflare Workers static assets.
# The hosted site publishes the public edition only; no company data goes to it.
# This is the hosted-edition deploy workflow of docs/decisions/0007-hosted-edition.md.
# The Cloudflare account, the custom host and the login live in the owner's account.
# The two deploy secrets exist only in the GitHub environment `hosted` (never at repository
# level) and FIELDBOOK_HOST is a repository variable.
# The job runs only on an ephemeral GitHub-hosted runner because a persistent
# self-hosted runner runs pull-request code. While hosted runners are unavailable
# to the repository (CI-01 in docs/controls.md) this workflow waits and nothing deploys.
name: hosted

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Worker version id to roll back to; leave empty to build and deploy this commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hosted
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WRANGLER_SEND_METRICS: "false"
      CARGO_INCREMENTAL: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the rollback input
        if: inputs.rollback_to != ''
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          if [[ ! "$ROLLBACK_TO" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "invalid rollback version id format" >&2
            exit 1
          fi
      - name: Check configuration
        env:
          FIELDBOOK_HOST: ${{ vars.FIELDBOOK_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FIELDBOOK_HOST" ]; then
            echo "FIELDBOOK_HOST is not set" >&2
            exit 1
          fi
          echo "FIELDBOOK_HOST: set"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN: missing" >&2
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN: set"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID: missing" >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID: set"
      - name: Search the tree for deployment identifiers
        env:
          FIELDBOOK_HOST: ${{ vars.FIELDBOOK_HOST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in FIELDBOOK_HOST CLOUDFLARE_ACCOUNT_ID; do
            value="${!name}"
            if [ -n "$value" ] && grep -r -F -q -e "$value" --exclude-dir=.git .; then
              echo "an identifier value appears in the tree: $name" >&2
              exit 1
            fi
          done
      - name: Install the pinned Rust toolchain
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.rollback_to == ''
        with:
          save-if: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: inputs.rollback_to == ''
        with:
          tool: just@1.58.0
      - name: Build the site
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          just site
      - name: Stage hosted assets and check limits
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          # The pages link to originals/ one level above the edition folder; on the site that is the root.
          rm -rf out/hosted && mkdir -p out/hosted && cp -a out/edition/. out/hosted/ && cp -a out/originals out/hosted/originals && cp deploy/_headers deploy/robots.txt out/hosted/
          if [ ! -f out/hosted/assets/app.css ]; then
            echo "missing out/hosted/assets/app.css" >&2
            exit 1
          fi
          cargo xtask hosted-limits out/hosted
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Install the deploy tool
        working-directory: deploy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          VERSION="$(npx --no-install wrangler --version)"
          if [ "$VERSION" != "4.153.0" ]; then
            echo "unexpected wrangler version: $VERSION" >&2
            exit 1
          fi
      - name: Check the login gate before the upload
        env:
          FIELDBOOK_HOST: ${{ vars.FIELDBOOK_HOST }}
        run: |
          set -euo pipefail
          bash deploy/check-login-gate.sh "https://${FIELDBOOK_HOST}" / /index.html /assets/app.css
      - name: Deploy
        if: inputs.rollback_to == ''
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --message "$GITHUB_SHA"
      - name: Roll back
        if: inputs.rollback_to != ''
        working-directory: deploy
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler rollback "$ROLLBACK_TO" --message "rollback from $GITHUB_SHA" --yes
      # Guards against the login being removed; the three paths are the home
      # page, the same page by file name and a real asset.
      - name: Check the login gate after the upload
        env:
          FIELDBOOK_HOST: ${{ vars.FIELDBOOK_HOST }}
        run: |
          set -euo pipefail
          bash deploy/check-login-gate.sh "https://${FIELDBOOK_HOST}" / /index.html /assets/app.css
