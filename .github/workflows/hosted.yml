# Publishes the public edition to Cloudflare Workers static assets; no company data.
# ADR docs/decisions/0007-hosted-edition.md.
# The three values CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and FIELDBOOK_HOST exist only as
# secrets of the GitHub environment `hosted`, whose deployment branch policy allows main only,
# never at repository level.
# The job runs on a fresh standard GitHub-hosted runner (CI-01).
# Mitigations: secrets only in environment `hosted` (main only); clean checkout without credentials;
# fresh out/; cargo --locked; npm ci --ignore-scripts; no data root, store, overlay, policy or state flag.
name: hosted

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Worker version id to roll back to; leave empty to build and deploy this commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hosted
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WRANGLER_SEND_METRICS: "false"
      CARGO_INCREMENTAL: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Start from a fresh output folder
        run: |
          set -euo pipefail
          rm -rf out
      - name: Validate the rollback input
        if: inputs.rollback_to != ''
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          if [[ ! "$ROLLBACK_TO" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "invalid rollback version id format" >&2
            exit 1
          fi
      - name: Check configuration
        env:
          FIELDBOOK_HOST: ${{ secrets.FIELDBOOK_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FIELDBOOK_HOST" ]; then
            echo "FIELDBOOK_HOST is not set" >&2
            exit 1
          fi
          echo "FIELDBOOK_HOST: set"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN: missing" >&2
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN: set"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID: missing" >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID: set"
      - name: Search the tree for deployment identifiers
        env:
          FIELDBOOK_HOST: ${{ secrets.FIELDBOOK_HOST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash deploy/check-no-identifiers.sh
      - name: Install the pinned Rust toolchain
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.rollback_to == ''
        with:
          save-if: false
      # The deploy installs no tool: this is the command of the justfile's site recipe, kept equal by a test.
      - name: Build the site
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo run -q --locked -p fieldbook -- build --out out
      - name: Stage hosted assets and check limits
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          # The pages link to originals/ one level above the edition folder; on the site that is the root.
          rm -rf out/hosted && mkdir -p out/hosted && cp -a out/edition/. out/hosted/ && cp -a out/originals out/hosted/originals && cp deploy/_headers deploy/robots.txt out/hosted/
          if [ ! -f out/hosted/assets/app.css ]; then
            echo "missing out/hosted/assets/app.css" >&2
            exit 1
          fi
          cargo --locked xtask hosted-limits out/hosted
      - name: Check the build is unreleased
        if: inputs.rollback_to == ''
        run: |
          set -euo pipefail
          bash deploy/check-unreleased.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Install the deploy tool
        working-directory: deploy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          VERSION="$(npx --no-install wrangler --version)"
          if [ "$VERSION" != "4.153.0" ]; then
            echo "unexpected wrangler version: $VERSION" >&2
            exit 1
          fi
      - name: Check the login gate before the upload
        env:
          FIELDBOOK_HOST: ${{ secrets.FIELDBOOK_HOST }}
        run: |
          set -euo pipefail
          bash deploy/check-login-gate.sh "https://${FIELDBOOK_HOST}" / /index.html /assets/app.css
      - name: Deploy
        if: inputs.rollback_to == ''
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler is told not to load .env files so a local token file on the persistent runner cannot reach it.
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --env-file=/dev/null --message "$GITHUB_SHA"
      - name: Roll back
        if: inputs.rollback_to != ''
        working-directory: deploy
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler rollback "$ROLLBACK_TO" --env-file=/dev/null --message "rollback from $GITHUB_SHA" --yes
      # Guards against the login being removed; the three paths are the home
      # page, the same page by file name and a real asset.
      - name: Check the login gate after the upload
        env:
          FIELDBOOK_HOST: ${{ secrets.FIELDBOOK_HOST }}
        run: |
          set -euo pipefail
          bash deploy/check-login-gate.sh "https://${FIELDBOOK_HOST}" / /index.html /assets/app.css
