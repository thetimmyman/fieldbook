[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
# The tool version. The pre-release value is 0.0.0; `just release X.Y.Z` sets it.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8+spec-1.1.0"
csv = "1.4.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
unicode-normalization = "0.1.25"
sha2 = { version = "0.11.0", default-features = false }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
rust_xlsxwriter = "0.99.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
insta = { version = "1.49.0", default-features = false }
tempfile = "3.27.0"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "pe"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
needless_pass_by_value = "deny"
semicolon_if_nothing_returned = "deny"
implicit_clone = "deny"
manual_let_else = "deny"
redundant_else = "deny"
match_same_arms = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
overflow-checks = true   # [J]

[profile.dist]           # used only by release.yml
inherits = "release"
lto = true
