{% if !plan_timeline.windows.is_empty() %}
<section class="panel plan-panel" aria-labelledby="fb:plan-timeline-head">
  <div class="panel-h">
    <h3 id="fb:plan-timeline-head">Timeline</h3>
    <span class="meta">Set a start date to mark today</span>
  </div>
  <div class="panel-b">
    <div class="tl90" data-axis-max="{{ plan_timeline.axis_max }}">
      <span class="k">Window</span>
      <div class="tl-axis-row">
        <div class="thirds">
          {% for win in &plan_timeline.windows %}
          <div class="win" data-start-day="{{ win.start_day }}" data-end-day="{{ win.end_day }}"><b>{{ win.label }}</b></div>
          {% endfor %}
        </div>
        <svg class="track tl-track" viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="{{ plan_timeline.aria_label }}">
          <rect class="bg" x="0" y="2" width="100" height="6"/>
          {% for win in &plan_timeline.windows %}
          <rect class="bar1" x="{{ win.x_attr }}" y="2" width="{{ win.width_attr }}" height="6"><title>{{ win.label }}</title></rect>
          {% endfor %}
        </svg>
      </div>
    </div>
  </div>
</section>
{% endif %}
