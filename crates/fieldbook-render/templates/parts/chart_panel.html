<figure class="panel chart">
  <figcaption><b>{{ title }}</b></figcaption>
  {% if let Some(f) = &figure %}<p class="chart-fig"><b>{{ f.value }}</b><span class="meta">{{ f.meaning }}</span></p>{% endif %}
  {% if let Some(u) = &unavailable %}
  {{ u.html|safe }}
  <p class="meta">{{ u.why }}</p>
  {% else %}
  {{ plot_html|safe }}
  <div class="chart-foot"><span class="meta">{{ source }}</span>{% if let Some(d) = &as_of %}<span class="meta">As of <time datetime="{{ d }}">{{ d }}</time></span>{% endif %}<span class="meta">{{ origin }}</span></div>
  {% if let Some(t) = &table %}
  <details class="fold"><summary><b>Table</b> · {{ t.rows.len() }} rows</summary>
    <div class="table-wrap"><table><caption>{{ t.caption }}</caption>
      <thead><tr>{% for h in &t.head %}<th scope="col"{% if !loop.first %} class="r"{% endif %}>{{ h }}</th>{% endfor %}</tr></thead>
      <tbody>{% for row in &t.rows %}<tr>{% for cell in row %}<td{% if !loop.first %} class="num"{% endif %}>{{ cell }}</td>{% endfor %}</tr>{% endfor %}</tbody>
    </table></div>
  </details>
  {% endif %}
  {% endif %}
</figure>
