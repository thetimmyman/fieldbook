<header class="topbar">
  <button class="btn ghost icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <nav aria-label="Sections">
    {% for tab in tabs %}
    {% if let Some(href) = &tab.href %}
    <a href="{{ root_prefix }}{{ href }}" data-sec="{{ tab.key }}"{% if tab.is_current %} aria-current="true"{% endif %}>{{ tab.label }}</a>
    {% else %}
    <span class="not-available" data-sec="{{ tab.key }}"{% if tab.is_current %} aria-current="true"{% endif %} title="{{ tab.landing_line }}">{{ tab.label }} <span class="sr-only">{{ tab.landing_line }}</span></span>
    {% endif %}
    {% endfor %}
  </nav>
  <div class="topbar-end">
    {% if let Some(date) = built_date %}<time class="chip" datetime="{{ date }}">{{ date }}</time>{% else %}<span class="chip">{{ unreleased_build }}</span>{% endif %}
    <span class="build-chip" id="frameChip" title="{{ store_chip_title }}">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
      <span>{{ store_chip_label }}</span>
    </span>
    <button class="btn ghost icon-btn" id="themeBtn" type="button" aria-label="Switch between light and dark theme" aria-pressed="false" title="Switch theme">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2v1.6M8 12.2v1.6M2.2 8h1.6M12.2 8h1.6M3.9 3.9l1.1 1.1M11 11l1.1 1.1M12.1 3.9L11 5M5 11l-1.1 1.1"/><circle cx="8" cy="8" r="2.8"/></svg>
    </button>
  </div>
</header>
