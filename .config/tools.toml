# Pinned developer tools and checksums (AD-07).
#
# `cargo xtask setup` installs them, `cargo xtask doctor` checks them, and the CI
# workflow installs the same versions (a test fails if the two disagree). Rust itself
# is pinned in rust-toolchain.toml. A tool joins when its output falls due, and each
# bump is its own card, adopted once the release is 14 days old. The card is `auto`
# when `cargo xtask deps --check`, `cargo deny check` and `just lock-verify` pass and
# the tool's row in docs/reference/dependencies.md is in the same pull request.

# Installed with `cargo install --locked NAME@VERSION`.
[cargo]
just = "1.58.0"
cargo-nextest = "0.9.148"
cargo-deny = "0.20.2"
typos-cli = "1.51.1"

# A release binary whose SHA-256 is checked before it is installed. Only the
# platforms in use have a checksum; add one before using another platform.
[gitleaks]
version = "8.30.1"
linux-x64-sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

# poppler provides `pdftotext` (used by `cargo xtask extract`) and `pdfinfo` (used by the
# home restore drill). It comes from the operating system's package manager, not from
# `cargo xtask setup`. `extract` warns on a different version and records the one it used.
[poppler]
version = "26.10.0"

# Resolves Cargo.lock under the 14-day cooldown. It never builds (AD-06). `just lock`
# also writes the cutoff it used here as `cutoff = "<UTC timestamp>"`, and
# `just lock-verify` re-resolves at that cutoff and fails if Cargo.lock differs or the
# cutoff is less than 14 days older than the head commit.
[lock]
nightly = "nightly-2026-10-08"
