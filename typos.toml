[files]
# Originals and their extracted text are byte-exact data: never "fix" them.
# The lockfile is generated.
extend-exclude = ["corpus/sources/**", "Cargo.lock"]

[default.extend-words]
# The crate name flate2.
flate = "flate"
# Codes in corpus.toml: the "fnd" area (foundation) and the "CPY" page type (company profile).
fnd = "fnd"
cpy = "cpy"
# A deliberate misspelling in the known-bad schema examples.
titel = "titel"
# "CAFÉ" in the tokenizer golden file splits at the escape.
caf = "caf"
# "MIS Builder", an accounting report tool named in docs/reference/dependencies.md.
mis = "mis"
# "ANC", the Alaska Native Corporation abbreviation printed in FAR subpart 19.7 and quoted in subcontracting cards.
anc = "anc"
# "withh", a regex fragment (withholding, withheld) in the search script of docs/design/mockup/index.html.
withh = "withh"
# "addres", the data hook of the add-results region in docs/design/mockup/index.html.
addres = "addres"
# "recuiting", a misspelling in the printed text of FAR 31.205-34(a)(4), copied verbatim into a claim quote.
recuiting = "recuiting"
# "modifiation", a misspelling in the printed text of FAR 52.229-3, copied verbatim into a claim quote.
modifiation = "modifiation"
# "FPRA", forward pricing rate agreement, as abbreviated in FAR 15.407-3 and the DCAA manual.
fpr = "fpr"
# "flexibily-priced", as misprinted in DFARS 242.1204(i) and quoted verbatim.
flexibily = "flexibily"
# "Procurment", as misprinted in DFARS 242.002 (Public Services and Procurement Canada) and quoted verbatim.
procurment = "procurment"
# "writtten", as misprinted in FAR 19.306 and quoted verbatim.
writtten = "writtten"
# "extention", as misprinted in FAR 52.217-8 and quoted verbatim.
extention = "extention"
# "Compensacion", "Fabricacion" and "Transmissiones", Spanish tax names printed in DFARS 252.229-7005 and quoted verbatim.
compensacion = "compensacion"
fabricacion = "fabricacion"
transmissiones = "transmissiones"
