# Synthetic test pairs for quote matching and normalisation.

[[pair]]
name = "curly_double_quotes_in_page"
quote = "\"standard tariff\""
page = "The regulation defines \u201Cstandard tariff\u201D for maritime routes."
expect = "match"
matched = "\u201Cstandard tariff\u201D"

[[pair]]
name = "curly_apostrophe_in_page"
quote = "vessel's log"
page = "The officer inspects the vessel\u2019s log daily."
expect = "match"
matched = "vessel\u2019s log"

[[pair]]
name = "curly_apostrophe_in_quote"
quote = "vessel\u2019s log"
page = "The officer inspects the vessel's log daily."
expect = "match"
matched = "vessel's log"

[[pair]]
name = "dashes_and_minus_in_page"
quote = "items 1-3 fee -5 credit -10"
page = "Schedule A lists items 1\u20133 fee \u22125 credit \u201410 accordingly."
expect = "match"
matched = "items 1\u20133 fee \u22125 credit \u201410"

[[pair]]
name = "dashes_and_minus_in_quote"
quote = "items 1\u20133 fee \u22125 credit \u201410"
page = "Schedule A lists items 1-3 fee -5 credit -10 accordingly."
expect = "match"
matched = "items 1-3 fee -5 credit -10"

[[pair]]
name = "whitespace_run_collapsed"
quote = "notice of departure"
page = "Submission requires notice \t\n \u00A0 of departure within five days."
expect = "match"
matched = "notice \t\n \u00A0 of departure"

