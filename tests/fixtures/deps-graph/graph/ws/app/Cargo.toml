[package]
name = "fieldbook"
version = "0.0.0"
edition = "2024"

[features]
net = ["dep:netlib"]

[dependencies]
normal = { path = "../../ext/normal", version = "0.1.0" }
both = { path = "../../ext/both", version = "0.1.0" }
netlib = { path = "../../ext/netlib", version = "0.1.0", optional = true }

[dev-dependencies]
devonly = { path = "../../ext/devonly", version = "0.1.0" }
both = { path = "../../ext/both", version = "0.1.0" }

[build-dependencies]
buildonly = { path = "../../ext/buildonly", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
winlib = { path = "../../ext/winlib", version = "0.1.0" }
